services:
  - type: web
    name: youtube-study-filter-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health
