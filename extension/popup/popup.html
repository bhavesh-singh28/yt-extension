<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Study Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
          </svg>
        </div>
        <h1>YouTube Study Filter</h1>
      </div>
      <label class="switch" title="Toggle study filter">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Backend Status Banner -->
    <div class="status-banner" id="backend-status-banner">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Checking backend...</span>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Strictness Mode -->
      <section class="section">
        <h2 class="section-title">Strictness</h2>
        <div class="radio-group" id="strictness-group">
          <label class="radio-option">
            <input type="radio" name="strictness" value="relaxed">
            <span class="radio-custom"></span>
            <div class="radio-label">
              <span class="radio-name">Relaxed</span>
              <span class="radio-desc">Only blur clearly non-educational</span>
            </div>
          </label>
          <label class="radio-option">
            <input type="radio" name="strictness" value="balanced" checked>
            <span class="radio-custom"></span>
            <div class="radio-label">
              <span class="radio-name">Balanced</span>
              <span class="radio-desc">Standard AI classification</span>
            </div>
          </label>
          <label class="radio-option">
            <input type="radio" name="strictness" value="strict">
            <span class="radio-custom"></span>
            <div class="radio-label">
              <span class="radio-name">Strict</span>
              <span class="radio-desc">Blur borderline & uncertain items</span>
            </div>
          </label>
        </div>
      </section>

      <!-- Options -->
      <section class="section">
        <div class="toggle-row">
          <span class="toggle-label">Blur non-educational videos</span>
          <label class="switch switch-sm">
            <input type="checkbox" id="toggle-blur" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Show reveal button</span>
          <label class="switch switch-sm">
            <input type="checkbox" id="toggle-reveal" checked>
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <!-- Statistics -->
      <section class="section stats-section">
        <h2 class="section-title">Statistics</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="stat-analyzed">0</span>
            <span class="stat-name">Analyzed</span>
          </div>
          <div class="stat-card stat-edu">
            <span class="stat-value" id="stat-educational">0</span>
            <span class="stat-name">Educational</span>
          </div>
          <div class="stat-card stat-filtered">
            <span class="stat-value" id="stat-filtered">0</span>
            <span class="stat-name">Filtered</span>
          </div>
          <div class="stat-card stat-revealed">
            <span class="stat-value" id="stat-revealed">0</span>
            <span class="stat-name">Revealed</span>
          </div>
        </div>
      </section>

      <!-- Server Configuration -->
      <section class="section">
        <h2 class="section-title">Backend API URL (Local / Render / AWS)</h2>
        <div class="server-input-group">
          <input type="text" id="input-backend-url" class="input-text" placeholder="http://localhost:3000" spellcheck="false">
          <button type="button" id="btn-save-url" class="btn-sm">Save</button>
        </div>
      </section>

      <!-- Actions -->
      <div class="actions-row">
        <button type="button" id="btn-clear-cache" class="btn-secondary">
          Clear Cache & Reset Stats
        </button>
      </div>
      <div id="action-feedback" class="action-feedback"></div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
